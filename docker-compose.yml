services:
  backend:
    build: ./backend/portfolioApi
    environment:
      - ConnectionStrings__DefaultConnection=${DATABASE_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/Projekter"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      - API_URL=http://backend:5000/api
      - NEXT_PUBLIC_API_URL=http://backend:5000/api
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge